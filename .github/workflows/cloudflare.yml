name: Deploy to Cloudflare

# allto on Cloudflare: builds the app and deploys it with its Worker (workers/allto).
# Needs the repository secret CLOUDFLARE_API_TOKEN ("Edit Cloudflare Workers" template); skips quietly without it.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Check for the Cloudflare token
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::No CLOUDFLARE_API_TOKEN secret yet, so nothing was deployed to Cloudflare."
      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_TOKEN == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Build allto
        if: env.HAS_TOKEN == 'true'
        run: npm ci && npm run build
        env:
          VITE_MAPBOX_TOKEN: ${{ vars.VITE_MAPBOX_TOKEN }}
          # The Worker serves allto and its /token route at the same address.
          VITE_AGENT_TOKEN_URL: /token
      - name: Test and deploy the Worker
        if: env.HAS_TOKEN == 'true'
        working-directory: workers/allto
        run: npm ci && node test.mjs && npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

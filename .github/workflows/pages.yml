name: Deploy to GitHub Pages

# allto now lives on Cloudflare behind Turley sign-in (see docs/cloudflare.md). GitHub Pages only publishes a
# page that sends people there, so no open copy of allto stays on the public web.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: A page that moves people to allto on Cloudflare
        run: |
          mkdir -p site
          cat > site/index.html <<'HTML'
          <!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>allto has moved</title><meta http-equiv="refresh" content="0; url=https://allto.chris-hemsley.workers.dev/ultrahand/">
          <style>body{font:16px/1.5 Helvetica,Arial,sans-serif;color:#141414;max-width:520px;margin:15vh auto;padding:0 24px}a{color:#141414}</style></head>
          <body><h1>allto has moved</h1><p>allto now needs a Turley sign-in. Go to <a href="https://allto.chris-hemsley.workers.dev/ultrahand/">allto.chris-hemsley.workers.dev</a>.</p></body></html>
          HTML
          cp site/index.html site/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
